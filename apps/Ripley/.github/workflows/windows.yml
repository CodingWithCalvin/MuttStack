name: Windows build and installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      MSBUILDUSESERVER: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test this repository independently
        shell: pwsh
        run: ./eng/test.ps1
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content eng/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?$') { throw 'Use a vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.REVISION tag.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version.Split('.').Count -eq 3) { $version += '.0' }
          } else {
            if ([long]$env:GITHUB_RUN_NUMBER -gt 65535) { throw 'Bump the base version before resetting the CI revision sequence.' }
            $parts = $version.Split('.'); $parts[3] = $env:GITHUB_RUN_NUMBER; $version = $parts -join '.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build self-contained installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./eng/package.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory "$PWD/artifacts/distribution"
      - name: Test installation, upgrades and the installed app
        shell: pwsh
        run: ./eng/test-installer.ps1 -Production
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ripley-windows
          path: |
            artifacts/distribution/*-setup.exe
            artifacts/distribution/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ripley-validation
          path: |
            artifacts/validation/**/*.png
            artifacts/validation/**/*.log
            artifacts/packaging/**/result.json
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ripley-windows
          path: artifacts/distribution
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($line in Get-Content artifacts/distribution/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid package checksum entry.' }
            $expected = $Matches[1]; $file = Join-Path artifacts/distribution $Matches[2]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Release package checksum mismatch.' }
          }
          $assets = Get-ChildItem artifacts/distribution -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --generate-notes --notes "Unsigned Windows installer. See docs/releases.md for installation details." --title "Ripley $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
