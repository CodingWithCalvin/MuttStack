name: Mutt Stack Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutt-stack-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: windows-2025
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the single release version and app boundaries
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $version = ./eng/version.ps1 -Tag $tag
          "package=$($version.package)" >> $env:GITHUB_OUTPUT
          ./eng/check-independence.ps1
          ./eng/test-release.ps1

  build:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [Scout, Ripley, Tucker]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      APPLICATION: ${{ matrix.app }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          # Retain Ripley/Tucker runtime compatibility. Every build uses the root SDK.
          dotnet-version: '9.0.x'
      - name: Build and test app and database contract rehearsals
        shell: pwsh
        run: ./eng/test.ps1 -Application $env:APPLICATION
      - name: Build self-contained installer
        shell: pwsh
        run: ./eng/package.ps1 -Application $env:APPLICATION -Version $env:PACKAGE_VERSION -OutputDirectory "$PWD/artifacts/distribution/$env:APPLICATION"
      - name: Test installation, upgrades and the installed app
        shell: pwsh
        run: ./eng/test-installer.ps1 -Application $env:APPLICATION -Production
      - name: Upload installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MuttStack-${{ matrix.app }}-windows
          path: |
            artifacts/distribution/${{ matrix.app }}/*-setup.exe
            artifacts/distribution/${{ matrix.app }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MuttStack-${{ matrix.app }}-validation
          path: |
            apps/${{ matrix.app }}/artifacts/validation/**/*.png
            apps/${{ matrix.app }}/artifacts/validation/**/*.log
            apps/${{ matrix.app }}/artifacts/packaging/**/result.json
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MuttStack-*-windows
          path: artifacts/release-input
      - name: Assemble and verify all three installers
        shell: pwsh
        run: ./eng/assemble-release.ps1 -InputDirectory artifacts/release-input -OutputDirectory artifacts/release -Tag $env:GITHUB_REF_NAME
      - name: Create one complete Mutt Stack draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --generate-notes --notes "Mutt Stack: Scout, Ripley and Tucker at one version. Unsigned Windows installers; see docs/releases.md." --title "Mutt Stack $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
